name: Build EXE

on:
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed music_note_trainer.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: note-trainer-exe
          path: dist/music_note_trainer.exe
